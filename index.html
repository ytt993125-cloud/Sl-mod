<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL BUSSID MODS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background:#0f1219;color:white;font-family:sans-serif">
<div style="max-width:1100px;margin:auto">
<header style="position:sticky;top:0;background:#0f1219;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #222">
<h1 id="logo" style="font-weight:900;font-size:22px;cursor:pointer">🚌 SL <span style="color:#a78bfa">MODS</span></h1>
<button id="uploadBtn" style="display:none;background:#7c3aed;padding:8px 20px;border-radius:99px;font-weight:bold">+ Upload</button>
</header>
<div style="padding:16px">
<div style="background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:24px;padding:28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
<div>
<h2 style="font-size:32px;font-weight:800">Sri Lankan BUSSID Mods</h2>
<p style="opacity:0.8;margin-top:6px">Fast Download | No Ads</p>
</div>
<div style="position:relative">
<i class="fa fa-search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;font-size:13px"></i>
<input id="search" oninput="render()" placeholder="Search..." style="width:170px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);border-radius:99px;padding:8px 18px 8px 34px;color:white;outline:none;font-size:14px">
</div>
</div>
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:24px"></div>
</div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:white;color:black;padding:10px 22px;border-radius:99px;font-weight:bold;font-size:14px;z-index:200">Link Copied! ✅</div>

<!-- Password Window -->
<div id="passWindow" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:101;align-items:center;justify-content:center;padding:16px">
<div style="background:#1a1e2a;width:100%;max-width:360px;border-radius:24px;padding:24px;text-align:center;border:1px solid #333">
<h3 style="font-weight:bold">Admin Login</h3><p style="font-size:12px;opacity:0.5;margin-top:4px">pass: 1234</p>
<input id="passInput" type="password" placeholder="Password" style="width:100%;margin-top:16px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px;text-align:center;color:white;outline:none">
<button onclick="checkPass()" style="width:100%;margin-top:12px;background:#7c3aed;padding:12px;border-radius:99px;font-weight:bold">Login</button>
<button onclick="closePass()" style="width:100%;margin-top:8px;background:#222;padding:10px;border-radius:99px">Cancel</button>
<p id="passErr" style="color:#ff6b6b;font-size:13px;margin-top:8px;display:none">Wrong Password!</p>
</div>
</div>

<!-- Upload Window -->
<div id="uploadWindow" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:16px">
<div style="background:#1a1e2a;width:100%;max-width:480px;border-radius:24px;padding:22px;border:1px solid #333;max-height:90vh;overflow-y:auto">
<div style="display:flex;justify-content:space-between"><h3 style="font-weight:bold;font-size:18px">Add New Mod</h3><button onclick="closeUpload()" style="background:#222;width:32px;height:32px;border-radius:99px"><i class="fa fa-times"></i></button></div>
<input id="mName" placeholder="Bus Name" style="width:100%;margin-top:16px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px 16px;color:white;outline:none">
<input id="mLink" placeholder="Download Link" style="width:100%;margin-top:10px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px 16px;color:white;outline:none">
<input id="mSize" placeholder="Size Ex: 45MB" style="width:100%;margin-top:10px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px 16px;color:white;outline:none">
<textarea id="mDesc" placeholder="Description" style="width:100%;margin-top:10px;background:#0f1219;border:1px solid #333;border-radius:16px;padding:12px 16px;color:white;outline:none;height:70px"></textarea>
<input id="mPhotos" type="file" multiple accept="image/*" style="width:100%;margin-top:10px;font-size:13px">
<div id="preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div>
<button onclick="saveMod()" style="width:100%;margin-top:16px;background:white;color:black;padding:14px;border-radius:99px;font-weight:bold">Save Mod</button>
</div>
</div>

<script>
let isAdmin=false;
let mods=JSON.parse(localStorage.getItem('sl_mods_v3')||'[]');
let tempPhotos=[];
const uploadBtn=document.getElementById('uploadBtn');const logo=document.getElementById('logo');
const passWindow=document.getElementById('passWindow');const uploadWindow=document.getElementById('uploadWindow');

function updateUI(){uploadBtn.style.display=isAdmin?'block':'none'}
logo.onclick=()=>{passWindow.style.display='flex'};
function closePass(){passWindow.style.display='none';document.getElementById('passInput').value='';document.getElementById('passErr').style.display='none'}
function checkPass(){if(document.getElementById('passInput').value==='1234'){isAdmin=true;closePass();updateUI();uploadWindow.style.display='flex'}else{document.getElementById('passErr').style.display='block'}}
function closeUpload(){uploadWindow.style.display='none'}uploadBtn.onclick=()=>{uploadWindow.style.display='flex'};

document.getElementById('mPhotos').addEventListener('change',async e=>{
  tempPhotos=[];let pre=document.getElementById('preview');pre.innerHTML='';
  for(let f of e.target.files){
    let b=await new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f)});
    tempPhotos.push(b);pre.innerHTML+=`<img src="${b}" style="width:60px;height:60px;border-radius:10px;object-fit:cover">`
  }
})

function saveMod(){
  let name=document.getElementById('mName').value.trim();
  let link=document.getElementById('mLink').value.trim();
  let size=document.getElementById('mSize').value.trim();
  let desc=document.getElementById('mDesc').value.trim();
  if(!name||!link||tempPhotos.length===0){alert('Name, Link, Photo ඕන!');return}
  mods.unshift({id:Date.now(),name,link,size,desc,photos:tempPhotos});
  localStorage.setItem('sl_mods_v3',JSON.stringify(mods));
  closeUpload();render();isAdmin=false;updateUI();
  document.getElementById('mName').value='';document.getElementById('mLink').value='';document.getElementById('mSize').value='';document.getElementById('mDesc').value='';document.getElementById('preview').innerHTML='';tempPhotos=[];
}

// SHARE - අදාල post එකේ link එක copy වෙනවා
function shareMod(id){
  let url = window.location.origin + window.location.pathname + "?mod=" + id;
  navigator.clipboard.writeText(url).then(()=>{
    let t=document.getElementById('toast');t.innerText="Link Copied! ✅ "+url; t.style.display='block';
    setTimeout(()=>t.style.display='none',2500);
    if(navigator.share){navigator.share({title:"SL MODS",url:url}).catch(()=>{})}
  });
}

function getModIdFromUrl(){
  let params = new URLSearchParams(window.location.search);
  return params.get('mod');
}

function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let grid=document.getElementById('grid');
  let focusedId = getModIdFromUrl();
  
  // search filter
  let filtered = mods.filter(m=>m.name.toLowerCase().includes(q));

  // අදාල mod එක උඩට ගේනවා
  if(focusedId){
    let found = filtered.find(m=>m.id==focusedId);
    if(found){
      filtered = [found, ...filtered.filter(m=>m.id!=focusedId)];
    }
  }

  if(filtered.length===0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;opacity:0.5;padding:60px">No Mods Yet<br><span style="font-size:12px">Logo -> pass 1234 -> Upload</span></div>`;return}

  grid.innerHTML=filtered.map((m,i)=>{
    let isFocused = (focusedId && m.id==focusedId);
    return `<div id="mod-${m.id}" style="background:#1a1e2a;border-radius:20px;overflow:hidden;border:${isFocused?'2px solid #a78bfa':'1px solid #222'};box-shadow:${isFocused?'0 0 20px rgba(167,139,250,0.4)':''}">
      <div style="position:relative">
        <img src="${m.photos[0]}" style="width:100%;height:190px;object-fit:cover">
        ${isFocused?`<span style="position:absolute;top:10px;left:10px;background:#a78bfa;color:black;font-size:11px;font-weight:bold;padding:4px 10px;border-radius:99px">SHARED LINK</span>`:''}
        <button onclick="shareMod(${m.id})" style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.2)"><i class="fa fa-share-nodes" style="color:white"></i></button>
      </div>
      <div style="padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 style="font-weight:bold">${m.name}</h3>
          <button onclick="shareMod(${m.id})" title="Copy Link" style="background:#222;width:32px;height:32px;border-radius:99px"><i class="fa-solid fa-link" style="font-size:12px"></i></button>
        </div>
        <p style="font-size:12px;opacity:0.5;margin-top:2px">${m.desc} ${m.size?'| '+m.size:''}</p>
        <a href="${m.link}" target="_blank" style="display:block;margin-top:12px;background:white;color:black;text-align:center;padding:10px;border-radius:99px;font-weight:bold;font-size:14px;text-decoration:none"><i class="fa fa-download"></i> Download</a>
      </div>
    </div>`
  }).join('');

  // Auto scroll to focused
  if(focusedId){
    setTimeout(()=>{
      let el=document.getElementById('mod-'+focusedId);
      if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
    },300);
  }
}
render();
</script>
</body>
</html>

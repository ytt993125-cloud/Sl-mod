<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL BUSSID MODS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body style="background:#0f1219;color:white">
<div style="max-width:1100px;margin:auto">
<header style="position:sticky;top:0;background:#0f1219;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #222">
<h1 id="logo" style="font-weight:900;font-size:22px;cursor:pointer">🚌 SL <span style="color:#a78bfa">MODS</span></h1>
<button id="uploadBtn" style="display:none;background:#7c3aed;padding:8px 20px;border-radius:99px;font-weight:bold">+ Upload</button>
</header>
<div style="padding:16px">
<div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:20px"></div>
</div>
</div>

<div id="passWindow" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:101;align-items:center;justify-content:center;padding:16px"><div style="background:#1a1e2a;width:100%;max-width:360px;border-radius:24px;padding:24px;text-align:center;border:1px solid #333"><h3 style="font-weight:bold">Admin Login</h3><input id="passInput" type="password" placeholder="pass: 1234" style="width:100%;margin-top:16px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px;text-align:center;color:white;outline:none"><button onclick="checkPass()" style="width:100%;margin-top:12px;background:#7c3aed;padding:12px;border-radius:99px;font-weight:bold">Login</button><button onclick="closePass()" style="width:100%;margin-top:8px;background:#222;padding:10px;border-radius:99px">Cancel</button><p id="passErr" style="color:#ff6b6b;font-size:13px;margin-top:8px;display:none">Wrong Password!</p></div></div>

<div id="uploadWindow" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;padding:16px"><div style="background:#1a1e2a;width:100%;max-width:480px;border-radius:24px;padding:22px;border:1px solid #333;max-height:90vh;overflow-y:auto"><div style="display:flex;justify-content:space-between"><h3 style="font-weight:bold">Add Mod</h3><button onclick="closeUpload()" style="background:#222;width:32px;height:32px;border-radius:99px"><i class="fa fa-times"></i></button></div><input id="mName" placeholder="Bus Name" style="width:100%;margin-top:16px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px 16px;color:white;outline:none"><input id="mLink" placeholder="Download Link" style="width:100%;margin-top:10px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px 16px;color:white;outline:none"><input id="mSize" placeholder="Size Ex: 45MB" style="width:100%;margin-top:10px;background:#0f1219;border:1px solid #333;border-radius:99px;padding:12px 16px;color:white;outline:none"><textarea id="mDesc" placeholder="Description" style="width:100%;margin-top:10px;background:#0f1219;border:1px solid #333;border-radius:16px;padding:12px 16px;color:white;outline:none;height:70px"></textarea><input id="mPhotos" type="file" multiple accept="image/*" style="width:100%;margin-top:10px"><div id="preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><button onclick="saveMod()" style="width:100%;margin-top:16px;background:white;color:black;padding:14px;border-radius:99px;font-weight:bold">Save & Download mod.json</button></div></div>

<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:white;color:black;padding:10px 22px;border-radius:99px;font-weight:bold;font-size:13px;z-index:200"></div>

<script>
let isAdmin=false, mods=[], tempPhotos=[];
const grid=document.getElementById('grid');
function updateUI(){document.getElementById('uploadBtn').style.display=isAdmin?'block':'none'}
document.getElementById('logo').onclick=()=>{document.getElementById('passWindow').style.display='flex'};
function closePass(){document.getElementById('passWindow').style.display='none'}
function checkPass(){if(document.getElementById('passInput').value==='1234'){isAdmin=true;closePass();updateUI();document.getElementById('uploadWindow').style.display='flex'}else{document.getElementById('passErr').style.display='block'}}
function closeUpload(){document.getElementById('uploadWindow').style.display='none'}
document.getElementById('uploadBtn').onclick=()=>{document.getElementById('uploadWindow').style.display='flex'};
document.getElementById('mPhotos').addEventListener('change',async e=>{tempPhotos=[];let pre=document.getElementById('preview');pre.innerHTML='';for(let f of e.target.files){let b=await new Promise(r=>{let rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f)});tempPhotos.push(b);pre.innerHTML+=`<img src="${b}" style="width:60px;height:60px;border-radius:10px;object-fit:cover">`}});

function shareMod(id){let url=location.origin+location.pathname+"?mod="+id;navigator.clipboard.writeText(url).then(()=>{let t=document.getElementById('toast');t.innerText="Link Copied! ✅";t.style.display='block';setTimeout(()=>t.style.display='none',2000)})}
function getModId(){return new URLSearchParams(location.search).get('mod')}

async function loadMods(){
 grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;opacity:0.5;padding:40px">Loading mod.json...</div>`;
 try{
  let res = await fetch('./mod.json?v='+Date.now());
  mods = await res.json();
 }catch{ mods=[]; grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;opacity:0.5">mod.json හොයාගන්න බෑ</div>`; return; }
 render();
}
function render(){
 let focused=getModId();
 let list=[...mods];
 if(focused){let f=list.find(m=>m.id==focused); if(f) list=[f,...list.filter(m=>m.id!=focused)];}
 if(list.length==0){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;opacity:0.5;padding:60px">No Mods Yet<br>Logo Click -> pass 1234 -> Upload</div>`;return}
 grid.innerHTML=list.map(m=>`<div style="background:#1a1e2a;border-radius:20px;overflow:hidden;border:1px solid #222"><img src="${m.photos[0]}" style="width:100%;height:190px;object-fit:cover"><div style="padding:14px"><h3 style="font-weight:bold">${m.name}</h3><p style="font-size:12px;opacity:0.5;margin-top:2px">${m.desc||''} ${m.size?'| '+m.size:''}</p><div style="display:flex;gap:8px;margin-top:12px"><a href="${m.link}" target="_blank" style="flex:1;background:white;color:black;text-align:center;padding:10px;border-radius:99px;font-weight:bold;font-size:14px;text-decoration:none"><i class="fa fa-download"></i> Download</a><button onclick="shareMod(${m.id})" style="background:#222;padding:10px 14px;border-radius:99px"><i class="fa fa-share"></i></button></div></div></div>`).join('');
}
function saveMod(){
 let name=document.getElementById('mName').value.trim();
 let link=document.getElementById('mLink').value.trim();
 let size=document.getElementById('mSize').value.trim();
 let desc=document.getElementById('mDesc').value.trim();
 if(!name||!link||tempPhotos.length==0){alert('Name, Link, Photo ඕන!');return}
 mods.unshift({id:Date.now(),name,link,size,desc,photos:tempPhotos});
 let blob=new Blob([JSON.stringify(mods,null,2)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mod.json';a.click();
 alert('mod.json Download වුණා! දැන් GitHub එකේ mod.json එක මකලා මේ අලුත් එක Upload කරලා Commit කරන්න. එතකොට හැමෝටම පේනවා!');
 closeUpload(); render();
}
loadMods();
</script>
</body>
</html>
